apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def releaseStoreFile = project.findProperty("HORTIVIA_RELEASE_STORE_FILE")
def releaseStorePassword = project.findProperty("HORTIVIA_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = project.findProperty("HORTIVIA_RELEASE_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("HORTIVIA_RELEASE_KEY_PASSWORD")
def developmentApiBaseUrl = "http://127.0.0.1:3001"
def productionApiBaseUrl = "https://p01--frutinavigator--h2j28jgg9qgs.code.run"
def debugRemoteApiBaseUrl = project.findProperty("HORTIVIA_DEBUG_API_URL")?.toString()?.trim()
def homologApiBaseUrl = project.findProperty("HORTIVIA_HOMOLOG_API_URL")?.toString()?.trim() ?: ""
def buildConfigString = { String value -> "\"${value.replace('\\', '\\\\').replace('\"', '\\\"')}\"" }
def validateRemoteApiBaseUrl = { String value, String propertyName ->
    try {
        def remoteUri = new URI(value)
        def productionUri = new URI(productionApiBaseUrl)
        if (remoteUri.scheme != "https" || !remoteUri.host || remoteUri.userInfo || remoteUri.query || remoteUri.fragment) {
            throw new GradleException("${propertyName} must be an HTTPS base URL without credentials, query, or fragment.")
        }
        if (remoteUri.host.equalsIgnoreCase(productionUri.host)) {
            throw new GradleException("${propertyName} must not target the production API.")
        }
        return value
    } catch (Exception error) {
        if (error instanceof GradleException) throw error
        throw new GradleException("Set ${propertyName} to a valid HTTPS API URL that is not production.")
    }
}

if (debugRemoteApiBaseUrl) {
    debugRemoteApiBaseUrl = validateRemoteApiBaseUrl(debugRemoteApiBaseUrl, "HORTIVIA_DEBUG_API_URL")
}
def hasReleaseSigning =
    releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }

    namespace "com.frutinavigator"
    defaultConfig {
        applicationId "com.frutinavigator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            buildConfigField "String", "HORTIVIA_API_BASE_URL", buildConfigString(debugRemoteApiBaseUrl ?: developmentApiBaseUrl)
            buildConfigField "String", "HORTIVIA_API_ENVIRONMENT", buildConfigString(debugRemoteApiBaseUrl ? "development-remote" : "development")
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            buildConfigField "String", "HORTIVIA_API_BASE_URL", buildConfigString(productionApiBaseUrl)
            buildConfigField "String", "HORTIVIA_API_ENVIRONMENT", buildConfigString("production")
        }
        homolog {
            initWith release
            matchingFallbacks = ["release"]
            applicationIdSuffix ".homolog"
            versionNameSuffix "-homolog"
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            buildConfigField "String", "HORTIVIA_API_BASE_URL", buildConfigString(homologApiBaseUrl)
            buildConfigField "String", "HORTIVIA_API_ENVIRONMENT", buildConfigString("homolog")
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name.toLowerCase().contains("homolog") }) {
        try {
            def homologUri = new URI(homologApiBaseUrl)
            if (homologUri.scheme != "https" || !homologUri.host || homologUri.userInfo || homologUri.query || homologUri.fragment) {
                throw new GradleException("HORTIVIA_HOMOLOG_API_URL must be an HTTPS base URL without credentials, query, or fragment.")
            }
            if (homologUri.host.equalsIgnoreCase(new URI(productionApiBaseUrl).host)) {
                throw new GradleException("HORTIVIA_HOMOLOG_API_URL must not target the production API.")
            }
        } catch (Exception error) {
            if (error instanceof GradleException) throw error
            throw new GradleException("Set HORTIVIA_HOMOLOG_API_URL to the approved HTTPS homologation API before building the pilot APK.")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
