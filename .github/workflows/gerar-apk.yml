name: Gerar APK HortiVia

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gerar-apk.yml

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Compilar APK de testes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar dependencias Android
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Instalar dependencias do aplicativo
        run: npm ci

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK Release para testes internos
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Preparar arquivo para download
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/HortiVia-teste.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: HortiVia-APK
          path: dist/HortiVia-teste.apk
          if-no-files-found: error
          retention-days: 30
